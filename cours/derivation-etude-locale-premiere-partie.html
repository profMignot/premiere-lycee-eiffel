<html lang="fr">
<head>

<title>Dérivation : étude locale (première partie)</title>

<style>

}

}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-ui);font-size:16px;line-height:1.45}
i{font-family:var(--font-math)}
.nw{white-space:nowrap}
.bigdef{display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;height:100%;gap:.8em}
.bigt{font-size:2.6em;font-weight:700;line-height:1.25}
.bigt.small{font-size:1.7em;font-weight:600}
.bigf{font-size:3.6em;font-family:var(--font-math)}
.pg{position:relative;min-height:100vh;overflow-x:hidden}
button{font:inherit;font-weight:500;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px}
button:focus-visible,input:focus-visible{outline:2px solid var(--curve);outline-offset:2px}

.win{position:absolute;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 28px rgba(0,0,0,.18);resize:none;overflow:hidden;min-width:200px;min-height:120px;max-width:100vw;font-size:var(--fs,16px)}
.win>.wbar{flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:.35em .8em;cursor:move;touch-action:none;user-select:none;background:color-mix(in srgb,var(--fg) 9%,transparent);border-bottom:1px solid var(--line);font:600 1.5em/1.3 var(--font-ui);color:var(--fg)}
.win>.wbar .hint{font-size:.55em;color:var(--muted);font-weight:400;text-transform:none;letter-spacing:0;opacity:.8}
.win>.wbody{flex:1 1 auto;min-height:0;overflow:auto;padding:.6em .9em .9em}
.win>.grip{position:absolute;right:0;bottom:0;width:22px;height:22px;cursor:nwse-resize;touch-action:none;z-index:5;background:linear-gradient(135deg,transparent 52%,var(--muted) 52%,var(--muted) 60%,transparent 60%,transparent 72%,var(--muted) 72%,var(--muted) 80%,transparent 80%);border-bottom-right-radius:12px;opacity:.8}
.win.fig>.wbody{padding:0;overflow:hidden;display:flex}
.win.fig svg{width:100%;height:100%;display:block;background:var(--surface)}

.sel{display:flex;flex-wrap:wrap;align-items:center;gap:.4em .5em;margin:.3em 0}
.sel .sl{color:var(--muted);font-size:.85em;margin-right:2px}
.sel .b{padding:.2em .7em;border-radius:999px;font-size:.9em;font-family:var(--font-math)}
.sel .b.on{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.ctl{margin:.4em 0 .6em}
.act{padding:.45em .9em;border-radius:.6em;border:2px solid var(--fg);font-weight:600;font-size:.95em;margin:.2em .4em .2em 0}
.act.alt{border-color:var(--secant);color:var(--secant)}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:.6em;align-items:center;margin:.3em 0}
.row label{font-size:2.5em}
.row .o{font-family:var(--font-math);font-size:2.9em;font-weight:600;white-space:nowrap}
input[type=range]{width:100%;accent-color:var(--secant);height:2em;margin:0}
.txt{font-family:var(--font-math);font-size:1.1em;margin:.4em 0}
.box{font-family:var(--font-math);font-size:1.1em;margin:.6em 0;padding:.5em .8em;border-left:6px solid var(--tangent);background:color-mix(in srgb,var(--tangent) 8%,transparent);border-radius:0 10px 10px 0}
.box.red{border-left-color:var(--red);background:color-mix(in srgb,var(--red) 6%,transparent)}
.box.sec{border-left-color:var(--secant);background:color-mix(in srgb,var(--secant) 8%,transparent)}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 .2em;text-align:center}
.fr>span:first-child{padding:0 .3em .08em;border-bottom:1.5px solid currentColor}
.fr>span:last-child{padding-top:.08em}
.val{font-family:var(--font-ui);font-weight:700;font-size:1.4em;color:var(--secant)}
.cstep{display:flex;align-items:center;gap:.8em;margin:.4em 0;padding:.4em .6em;border-radius:10px;background:color-mix(in srgb,var(--fg) 5%,transparent);animation:cin .35s ease}

.clab{flex:0 0 10em;font:700 .78em "IBM Plex Sans",sans-serif;color:#fff;border-radius:999px;padding:.35em .8em;text-align:center}
.c0{background:#1d5fb8}.c1{background:#c24a08}.c2{background:#6b3fa0}.c3{background:#0f7a5a}.c4{background:#c40000}.c5{background:#475569}

.cexp b{color:var(--tangent)}

svg .tk{font-size:13px}

@media (max-width:860px){
  .pg{display:flex;flex-direction:column;gap:12px;padding:10px 10px 96px;min-height:0!important}

/* ---------- repère : x de -5 à 5, y de -4 à 6 ---------- */
var W=560, U=48, OX=280, OY=330;
function X(x){return OX+U*x}
function Y(y){return OY-U*y}
function T(s,x,y,cls,anc){return '<text class="'+(cls||"")+'" x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" text-anchor="'+(anc||"middle")+'">'+s+'</text>'}
function base(){
  var g="", i;
  for(i=-5;i<=5;i++) if(i) g+='<line class="grid" x1="'+X(i)+'" y1="0" x2="'+X(i)+'" y2="'+W+'"/>';
  for(i=-4;i<=6;i++) if(i) g+='<line class="grid" x1="0" y1="'+Y(i)+'" x2="'+W+'" y2="'+Y(i)+'"/>';
  g+='<line class="axis" x1="0" y1="'+Y(0)+'" x2="'+W+'" y2="'+Y(0)+'"/><line class="axis" x1="'+X(0)+'" y1="0" x2="'+X(0)+'" y2="'+W+'"/>';
  for(i=-5;i<=5;i++) if(i) g+=T('<tspan class="tk">'+fm(i)+'</tspan>',X(i),Y(0)+17,"","middle");
  for(i=-4;i<=6;i++) if(i) g+=T('<tspan class="tk">'+fm(i)+'</tspan>',X(0)-6,Y(i)+5,"","end");
  g+=T("O",X(0)-7,Y(0)+17,"","end")+T(IS("x"),W-12,Y(0)-8,"","middle")+T(IS("y"),X(0)+12,16,"","middle");
  return g;
}
function curve(f){
  var d="", x, yy;
  for(x=-5.2;x<=5.2;x+=0.05){ yy=Y(f(x)); if(yy<-300) yy=-300; if(yy>860) yy=860; d+=(d?"L":"M")+X(x).toFixed(1)+" "+yy.toFixed(1); }
  return '<path class="curve" d="'+d+'"/>';
}
function ln(m,p,cls){ return '<line class="'+cls+'" x1="'+X(-5.6)+'" y1="'+Y(m*-5.6+p)+'" x2="'+X(5.6)+'" y2="'+Y(m*5.6+p)+'"/>'; }
function cross(x,y,cls){var cx=X(x), cy=Y(y); return '<path class="'+cls+'" d="M'+(cx-7)+' '+(cy-7)+'L'+(cx+7)+' '+(cy+7)+'M'+(cx-7)+' '+(cy+7)+'L'+(cx+7)+' '+(cy-7)+'"/>';}
function arrowPx(a,b,c,d){
  var dx=c-a, dy=d-b, L=Math.hypot(dx,dy);
  if(L<1) return "";
  var ux=dx/L, uy=dy/L, hs=Math.min(10,L/2);
  var p1=(c-hs*ux+4*uy).toFixed(1)+","+(d-hs*uy-4*ux).toFixed(1), p2=(c-hs*ux-4*uy).toFixed(1)+","+(d-hs*uy+4*ux).toFixed(1);
  return '<line class="harr" x1="'+a.toFixed(1)+'" y1="'+b.toFixed(1)+'" x2="'+c.toFixed(1)+'" y2="'+d.toFixed(1)+'"/><polygon class="harrh" points="'+c.toFixed(1)+','+d.toFixed(1)+' '+p1+' '+p2+'"/>';
}
function arrow(x1,y1,x2,y2){ return arrowPx(X(x1),Y(y1),X(x2),Y(y2)); }
function stepsHTML(rows,n){
  var h="";
  rows.forEach(function(r,i){ if(i<n) h+='<div class="cstep"><span class="clab '+r[0]+'">'+r[1]+'</span><span class="cexp">'+r[2]+'</span></div>'; });
  return h;
}
function setBtn(id,k,len){ $("btn"+id).textContent=(k>=len)?"Recommencer ↺":"Étape suivante →"; }

/* ---------- état des pages ---------- */
var P=PG.map(function(c,idx){ return {i:idx+1,c:c,type:c.type,n:0}; });
var HINT='<span class="hint">déplacer ↔ · agrandir ⇲</span>';
function figW(i){ return '<div class="win fig"><div class="wbar"><span>Figure</span>'+HINT+'</div><div class="wbody"><svg id="svg'+i+'" viewBox="0 0 560 560" role="img" aria-label="Repère et courbe"></svg></div></div>'; }
function twinW(i,tit,ctl){ return '<div class="win twin" data-fs="36"><div class="wbar"><span>'+tit+'</span>'+HINT+'</div><div class="wbody"><div class="sel" id="sel'+i+'"></div>'+(ctl?'<div class="ctl" id="ctl'+i+'"></div>':'')+'<div id="out'+i+'"></div></div></div>'; }
P.forEach(function(p){

      +(c.bouton?'<button type="button" class="p1btn" id="go'+i+'">'+c.bouton+'</button>':'')+'</div></div>';
  } else if(p.type==="grand"){
    var cls={titre:"bigt",petit:"bigt small",formule:"bigf",enorme:"bigt"};
    h='<div class="win card" data-fs="46"><div class="wbar"><span>'+c.titre_fenetre+'</span>'+HINT+'</div><div class="wbody bigdef">'
      +c.lignes.map(function(l){return '<div class="'+cls[l[1]]+'"'+(l[1]==="enorme"?' style="font-size:4em"':'')+'>'+l[0]+'</div>'}).join("")+'</div></div>';
  } else if(p.type==="curseur"){

  } else {

/* ---------- courbes au choix (lire, équation, tracer, entraînement) ---------- */
function mkCU(list){
  return list.map(function(c){ return {lab:FL(c), f:FN(c.f), d:FN(c.d), as:c.points}; });
}
function cs(ci,ai,arr){var c=arr[ci], a=c.as[ai], fa=c.f(a), m=c.d(a); return {c:c,a:a,fa:fa,m:m,p:fa-m*a};}
function selUI(id,st,withA,arr){
  var h='<span class="sl">Courbe :</span>';
  arr.forEach(function(c,i){ h+='<button type="button" class="b'+(st.ci===i?" on":"")+'" data-c="'+i+'">'+c.lab+'</button>'; });
  if(withA){
    h+='<br><span class="sl">Point :</span>';
    arr[st.ci].as.forEach(function(a,i){ h+='<button type="button" class="b'+(st.ai===i?" on":"")+'" data-a="'+i+'">'+I("a")+' = '+fm(a)+'</button>'; });
  }
  var el=$(id); el.innerHTML=h;
  el.onclick=function(e){
    var b=e.target.closest("button"); if(!b) return;
    if(b.hasAttribute("data-c")){ st.ci=+b.getAttribute("data-c"); if(withA) st.ai=2; }
    else st.ai=+b.getAttribute("data-a");
    if("n" in st) st.n=0;
    if("rev" in st) st.rev=false;
    selUI(id,st,withA,arr); render();
  };
}
function autreExemple(p){
  var ci=p.ci, ai=p.ai, t=0, nb=p.CU.length;
  while(t<20 && ci===p.ci && ai===p.ai){ ci=Math.floor(Math.random()*nb); ai=Math.floor(Math.random()*3); t++; }
  p.ci=ci; p.ai=ai; p.n=0; p.rev=false;
}

/* ================= taux de variation ================= */
function rowsEx(p){
  var f=p.f, a=p.a, b=p.b, fa=f(a), fb=f(b), dx=b-a, dy=fb-fa, m=dy/dx;
  function calc(x){ return SUB(p.c.fn.etiquette,x)+" = "+fm(f(x)); }
  return [
   ["c0","Je calcule les ordonnées", fp(a)+" = "+calc(a)+"<br>"+fp(b)+" = "+calc(b)],
   ["c1","Je calcule le taux de variation", fr(fp(b)+" − "+fp(a),fm(b)+" − "+par(a))+" = "+fr(fm(fb)+" − "+par(fa),fm(b)+" − "+par(a))+" = "+fr(fm(dy),fm(dx))+" = <b>"+fm(m)+"</b>"],
   ["c2","Coefficient directeur de (AM)","Le taux de variation est aussi le <b>coefficient directeur de la sécante</b> (AM) :<br>"
     +fr(YM_YA,XM_XA)+" = "+fr(fm(fb)+" − "+par(fa),fm(b)+" − "+par(a))+" = "+fr(fm(dy),fm(dx))+" = <b>"+fm(m)+"</b> = le taux de variation"],
   ["c5","Vérification graphique","Avec les flèches : de A à M, on avance de <b>"+fm(dx)+"</b> (flèche horizontale) et on "+(dy>=0?"monte":"descend")+" de <b>"+fm(Math.abs(dy))+"</b> (flèche verticale) :<br>"+fr(fm(dy),fm(dx))+" = "+fm(m)+" ✓"],
   ["c4","Je conclus","Le taux de variation de "+I("f")+" entre "+fm(a)+" et "+fm(b)+" est <b>"+fm(m)+"</b>.<br>C’est le <b>coefficient directeur de la sécante</b> (AM)."]
  ];
}
function drawEx(p){
  var f=p.f, a=p.a, b=p.b, fa=f(a), fb=f(b), m=(fb-fa)/(b-a);
  var g=base()+curve(f)+ln(m,fa-m*a,"sec");
  if(p.n>=4) g+=arrow(a,fa,b,fa)+arrow(b,fa,b,fb)+T(fm(b-a),X((a+b)/2),Y(fa)+(fb>=fa?19:-8),"tn","middle")+T(fm(fb-fa),X(b)+10,Y((fa+fb)/2)+5,"tn","start");
  g+=cross(a,fa,"cA")+cross(b,fb,"cM")+T("A",X(a)-10,Y(fa)-12,"tA","end")+T("M",X(b)+10,Y(fb)-12,"tM","start");
  $("svg"+p.i).innerHTML=g;
  var rows=rowsEx(p);
  setBtn(p.i,p.n,rows.length);
  $("out"+p.i).innerHTML='<div class="p2txt">Soit '+I("f")+' la fonction définie par '+FL(p.c.fn)+'.<br>Le point A de la courbe a pour abscisse '+fm(a)+', le point M a pour abscisse '+fm(b)+'.<br>Calculer le taux de variation de '+I("f")+' entre '+fm(a)+' et '+fm(b)+'.</div>'+stepsHTML(rows,p.n);
}
function initEx(p){
  p.f=FN(p.c.fn.f); p.a=p.c.a; p.b=p.c.b;
  $("ctl"+p.i).innerHTML='<button type="button" class="act" id="btn'+p.i+'">Étape suivante →</button>';
  $("btn"+p.i).onclick=function(){ p.n=(p.n>=rowsEx(p).length)?0:p.n+1; render(); };
}

/* ================= curseur h ================= */
function drawCur(p){
  var f=p.f, a=p.a, fa=f(a), h=p.HV[p.k], xm=a+h, fb=f(xm), zero=(h===0), g=base()+curve(f);
  var yAx=Y(0), endV=yAx+62, rowArr=yAx+48, rowLab=yAx+84;
  var x1=X(a), x2=X(xm), yA=Y(fa), yM=Y(fb), mid=(x1+x2)/2, lx=X(0)-24, m=zero?0:(fb-fa)/h;
  if(!zero) g+=ln(m,fa-m*a,"sec");
  g+='<line class="vA" x1="'+x1+'" y1="'+yA+'" x2="'+x1+'" y2="'+endV+'"/><line class="vA" x1="'+x1+'" y1="'+yA+'" x2="'+X(0)+'" y2="'+yA+'"/>';
  if(!zero) g+='<line class="vM" x1="'+x2+'" y1="'+yM+'" x2="'+x2+'" y2="'+endV+'"/><line class="vM" x1="'+x2+'" y1="'+yM+'" x2="'+X(0)+'" y2="'+yM+'"/>';
  if(Math.abs(x2-x1)>=5) g+=arrowPx(x1,rowArr,x2,rowArr)+T(IS("h"),mid,rowArr-8,"","middle");
  g+=T(fm(a),x1,rowLab,"tA","middle");
  if(!zero&&Math.abs(x2-x1)>=44) g+=T(fm(a)+" + "+IS("h"),x2,rowLab,"tM","middle");
  var yFa=yA-5, yFm=yM-5;
  if(!zero&&Math.abs(yA-yM)<18){ if(yM<yA) yFa=yA+16; else yFm=yM+16; }
  g+=T(IS("f")+"("+fm(a)+")",lx,yFa,"tA","end");
  if(!zero) g+=T(IS("f")+"("+fm(a)+" + "+IS("h")+")",lx,yFm,"tM","end");
  g+=cross(a,fa,"cA")+T("A",x1+10,yA+20,"tA","start");
  if(!zero) g+=cross(xm,fb,"cM")+T("M",x2-10,yM-12,"tM","end");
  $("svg"+p.i).innerHTML=g;
  $("o"+p.i).innerHTML=I("h")+" = "+fm6(h);
  var o='<div class="p2txt">Soit '+I("f")+' la fonction définie sur ℝ par '+FL(p.c.fn)+'.<br>Le point A a pour abscisse '+fm(a)+' et le point M a pour abscisse '+fm(a)+' + '+I("h")+' (avec '+I("h")+' ≠ 0). Déplace le curseur '+I("h")+'.</div>';
  if(zero){
    o+='<div class="box sec">Pour '+I("h")+' = 0, M est confondu avec A : il n’y a plus de sécante (AM), et on ne peut pas diviser par 0.</div>';
  } else {
    o+='<div class="box sec">Taux de variation de '+I("f")+' entre '+fm(a)+' et '+fm(a)+' + '+I("h")+' :<br>'
      +fr(I("f")+"("+fm(a)+" + "+I("h")+") − "+I("f")+"("+fm(a)+")",I("h"))+" = "+fr(I("f")+"("+fm6(xm)+") − "+I("f")+"("+fm(a)+")",fm6(h))+" = "+fr(fm6(fb)+" − "+par(fa),fm6(h))+' = <span class="val">'+fm6(m)+'</span></div>';
  }
  $("out"+p.i).innerHTML=o;
}
function initCur(p){
  p.f=FN(p.c.fn.f); p.a=p.c.a; p.HV=p.c.valeurs; p.k=p.HV.indexOf(p.c.h0);
  $("ctl"+p.i).innerHTML='<div class="row"><label for="s'+p.i+'">'+I("h")+'</label><input type="range" id="s'+p.i+'" min="0" max="'+(p.HV.length-1)+'" step="1" value="'+p.k+'"><span class="o" id="o'+p.i+'"></span></div><button type="button" class="p2btn sec" id="h0'+p.i+'">Mettre h à 0</button>';
  $("h0"+p.i).onclick=function(){ p.k=p.HV.indexOf(0); $("s"+p.i).value=p.k; render(); };
  $("s"+p.i).oninput=function(){ p.k=+this.value; render(); };
}

/* ================= tangentes ================= */
function tgv(p){var a=p.a, fa=p.f(a), m=p.d(a); return {a:a,fa:fa,m:m,p:fa-m*a,xb:a+1,yb:fa+m};}
function rowsTg(p){
  var v=tgv(p), a=v.a;
  if(v.m===0) return [
   ["c0","Je lis le coefficient directeur","La tangente est <b>horizontale</b> : son coefficient directeur est <b>0</b>."],
   ["c4","Je conclus","C’est le <b>nombre dérivé</b> de "+I("f")+" en "+fm(a)+", noté "+dp(a)+" : <b>"+dp(a)+" = 0</b>."]
  ];
  return [
   ["c0","Je lis deux points de la tangente","A("+fm(a)+" ; "+fm(v.fa)+") et B("+fm(v.xb)+" ; "+fm(v.yb)+")"],
   ["c1","Je lis le coefficient directeur","Avec les flèches : de A à B, on avance de <b>1</b> et on "+(v.m>0?"monte de <b>"+fm(v.m)+"</b>":v.m<0?"descend de <b>"+fm(Math.abs(v.m))+"</b>":"ne monte pas (<b>0</b>)")+" :<br>"+fr(fm(v.m),"1")+" = <b>"+fm(v.m)+"</b>"],
   ["c4","Je conclus","Le coefficient directeur de la tangente à la courbe au point d’abscisse "+fm(a)+" est <b>"+fm(v.m)+"</b>.<br>C’est le <b>nombre dérivé</b> de "+I("f")+" en "+fm(a)+", noté "+dp(a)+" : <b>"+dp(a)+" = "+fm(v.m)+"</b>."]
  ];
}
function drawTg(p){
  var v=tgv(p), a=v.a, m2=p.c.m2;
  var g=base()+curve(p.f)+ln(v.m,v.p,"tan")+cross(a,v.fa,"cA")+T("A",X(a)-10,Y(v.fa)-12,"tA","end");
  if(m2!==null&&m2!==undefined) g+=cross(m2,p.f(m2),"cM")+T("M",X(m2)+10,Y(p.f(m2))-12,"tM","start");
  if(v.m!==0&&p.n>=1) g+=cross(v.xb,v.yb,"cM")+T("B",X(v.xb)+10,Y(v.yb)+(v.m<0?22:-12),"tM","start");
  if(v.m!==0&&p.n>=2){
    g+=arrow(a,v.fa,v.xb,v.fa)+arrow(v.xb,v.fa,v.xb,v.yb)
      +T("1",X(a+0.5),Y(v.fa)+(v.m>=0?19:-8),"tn","middle")+T(fm(v.m),X(v.xb)+10,Y(v.fa+v.m/2)+5,"tn","start");
  }
  $("svg"+p.i).innerHTML=g;
  var rows=rowsTg(p);
  setBtn(p.i,p.n,rows.length);
  $("out"+p.i).innerHTML='<p class="txt">Courbe de '+FL(p.c.fn)+'.</p>'
    +'<div class="p2txt">La droite verte est la <b>tangente</b> à la courbe au point A d’abscisse '+fm(a)+'. On détermine son coefficient directeur.</div>'
    +((m2!==null&&m2!==undefined)?'<div class="p2txt">Cette droite recoupe la courbe en un point M. En A, elle est <b>tangente</b> à la courbe ; en M, elle est <b>sécante</b> sans être tangente.<br><b>Une tangente est une sécante particulière.</b></div>':'')
    +stepsHTML(rows,p.n);
}
function initTg(p){
  p.f=FN(p.c.fn.f); p.d=FN(p.c.fn.d); p.a=p.c.a;
  $("ctl"+p.i).innerHTML='<button type="button" class="act" id="btn'+p.i+'">Étape suivante →</button>';
  $("btn"+p.i).onclick=function(){ p.n=(p.n>=rowsTg(p).length)?0:p.n+1; render(); };
}

/* ================= lire f(a) et f'(a), pas à pas ================= */
function rowsLire(p){
  var k=cs(p.ci,p.ai,p.CU), a=k.a, m=k.m;
  return [
   ["c0","Je lis f(a)","Le point A a pour abscisse "+fm(a)+" (pointillé vertical). Je lis son <b>ordonnée</b> sur l’axe des ordonnées (pointillé horizontal) :<br><b>"+fp(a)+" = "+fm(k.fa)+"</b>."],
   ["c1","Je lis f′(a)", m!==0
      ? "Le coefficient directeur de la tangente au point d’abscisse <b>"+fm(a)+"</b> est <b>"+fm(m)+"</b>.<br>Donc <b>"+dp(a)+" = "+fm(m)+"</b>."
      : "La tangente au point d’abscisse <b>"+fm(a)+"</b> est <b>horizontale</b> (parallèle à l’axe des abscisses), donc son coefficient directeur est <b>0</b>.<br>Donc <b>"+dp(a)+" = 0</b>."],
   ["c4","Je conclus",fp(a)+" = <b>"+fm(k.fa)+"</b> : <b>ordonnée</b> du point A.<br>"+dp(a)+" = <b>"+fm(m)+"</b> : <b>coefficient directeur</b> de la tangente en A.<br><b>Ne pas confondre</b> "+I("f")+"("+I("a")+") et "+I("f")+"′("+I("a")+")."]
  ];
}
function drawLire(p){
  var k=cs(p.ci,p.ai,p.CU), n=p.n, a=k.a, m=k.m;
  var g=base()+curve(k.c.f)+ln(m,k.p,"tan");
  if(n>=1){
    if(a!==0) g+='<line class="vA" x1="'+X(a)+'" y1="'+Y(k.fa)+'" x2="'+X(0)+'" y2="'+Y(k.fa)+'"/>';
    if(a!==0&&k.fa!==0) g+='<line class="vA" x1="'+X(a)+'" y1="'+Y(k.fa)+'" x2="'+X(a)+'" y2="'+Y(0)+'"/>';
    g+=(a<0?T(IS("f")+"("+fm(a)+")",X(0)+8,Y(k.fa)-9,"tA","start"):T(IS("f")+"("+fm(a)+")",X(0)-24,Y(k.fa)-9,"tA","end"));
  }
  if(n>=2&&m!==0){
    g+=arrow(a,k.fa,a+1,k.fa)+T("1",X(a+0.5),Y(k.fa)+(m>=0?19:-8),"tn","middle");
    g+=arrow(a+1,k.fa,a+1,k.fa+m)+cross(a+1,k.fa+m,"cM")+T(fm(m),X(a+1)+10,Y(k.fa+m/2)+5,"tn","start");
  }
  g+=cross(a,k.fa,"cA")+(a===0?T("A",X(a)+10,Y(k.fa)-12,"tA","start"):T("A",X(a)-10,Y(k.fa)-12,"tA","end"));
  $("svg"+p.i).innerHTML=g;
  var rows=rowsLire(p); setBtn(p.i,n,rows.length);
  $("out"+p.i).innerHTML='<p class="txt">Courbe de '+k.c.lab+'.</p>'
    +'<div class="p2txt">La droite verte est la tangente à la courbe au point A d’abscisse '+fm(a)+'. Déterminer '+fp(a)+' et '+dp(a)+'.</div>'+stepsHTML(rows,n);
}
function initLire(p){
  p.CU=mkCU(p.c.courbes); p.ci=0; p.ai=0;
  $("ctl"+p.i).innerHTML='<button type="button" class="act" id="btn'+p.i+'">Étape suivante →</button><button type="button" class="act alt" id="nw'+p.i+'">Nouvel exemple</button>';
  $("btn"+p.i).onclick=function(){ p.n=(p.n>=rowsLire(p).length)?0:p.n+1; render(); };
  $("nw"+p.i).onclick=function(){ autreExemple(p); selUI("sel"+p.i,p,true,p.CU); render(); };
  selUI("sel"+p.i,p,true,p.CU);
}

/* ================= lire l'équation d'une tangente ================= */
function rowsEq(p){
  var k=cs(p.ci,p.ai,p.CU), m=k.m, q=k.p;
  return [
   ["c1","Je lis le coefficient directeur", m!==0
      ? "Avec les flèches : à partir de A, on avance de <b>1</b> et on "+(m>0?"monte":"descend")+" de <b>"+fm(Math.abs(m))+"</b> :<br>"+I("a")+" = "+fr(fm(m),"1")+" = <b>"+fm(m)+"</b>"
      : "La tangente est <b>horizontale</b> : son coefficient directeur est <b>0</b>."],
   ["c4","J’en déduis le nombre dérivé","Le coefficient directeur de la tangente est le nombre dérivé : <b>"+dp(k.a)+" = "+fm(m)+"</b>."],
   ["c0","Je lis l’ordonnée à l’origine","La tangente coupe l’axe des ordonnées en (0 ; "+fm(q)+") :<br>l’ordonnée à l’origine est <b>"+I("b")+" = "+fm(q)+"</b>."],
   ["c2","J’écris l’équation","La tangente a pour équation <b>"+eqS(m,q)+"</b>."]
  ];
}
function drawEq(p){
  var k=cs(p.ci,p.ai,p.CU), n=p.n, a=k.a, m=k.m, q=k.p, g=base()+curve(k.c.f)+ln(m,q,"tan")+cross(a,k.fa,"cA")+T("A",X(a)-10,Y(k.fa)-12,"tA","end");
  if(n>=1){
    g+=arrow(a,k.fa,a+1,k.fa)+T("1",X(a+0.5),Y(k.fa)+(m>=0?19:-8),"tn","middle");
    if(m!==0) g+=arrow(a+1,k.fa,a+1,k.fa+m)+cross(a+1,k.fa+m,"cM")+T(fm(m),X(a+1)+10,Y(k.fa+m/2)+5,"tn","start");
  }
  if(n>=3) g+=cross(0,q,"cP");
  $("svg"+p.i).innerHTML=g;
  var rows=rowsEq(p), rv=p.rev;
  $("btn"+p.i).textContent=(n===0)?"Voir la méthode →":(n>=rows.length)?"Masquer la méthode ↺":"Étape suivante →";
  function hv(t){ return '<span class="hv'+(rv?' on':'')+'">'+(rv?t:'')+'</span>'; }
  $("out"+p.i).innerHTML='<p class="txt">Courbe de '+k.c.lab+'.</p>'
    +'<div class="p2txt">La tangente est tracée au point A d’abscisse '+fm(a)+'. On lit graphiquement son coefficient directeur, on en déduit '+dp(a)+', puis on lit l’ordonnée à l’origine pour écrire l’équation de la tangente.</div>'
    +'<div class="p2ans"><p>Le coefficient directeur de la tangente est '+hv(fm(m))+'.</p>'
    +'<p>Donc le nombre dérivé : '+dp(a)+' = '+hv(fm(m))+'</p>'
    +'<p>L’ordonnée à l’origine est '+hv(fm(q))+'.</p>'
    +'<p>La tangente a pour équation '+hv(eqS(m,q))+'.</p>'
    +'<button type="button" class="p2btn" id="rv'+p.i+'">'+(rv?'Masquer les valeurs':'Afficher les valeurs')+'</button></div>'
    +stepsHTML(rows,n);
}
function initEq(p){
  p.CU=mkCU(p.c.courbes); p.ci=0; p.ai=2; p.rev=false;
  $("ctl"+p.i).innerHTML='<button type="button" class="act" id="btn'+p.i+'">Voir la méthode →</button>';
  $("btn"+p.i).onclick=function(){ p.n=(p.n>=rowsEq(p).length)?0:p.n+1; render(); };
  $("out"+p.i).onclick=function(e){ if(e.target.id==="rv"+p.i){ p.rev=!p.rev; render(); } };
  selUI("sel"+p.i,p,true,p.CU);
}

/* ================= tracer une tangente ================= */
function rowsTr(p){
  var k=cs(p.ci,p.ai,p.CU), a=k.a, m=k.m, q=k.p;
  var hz=(m===0), L=[
   ["c4","Je lis le nombre dérivé","L’équation est de la forme "+'<span class="nw">'+I("y")+" = "+I("a")+I("x")+" + "+I("b")+'</span>'+" : le coefficient directeur de la tangente est "+I("a")+" = "+fm(m)+", donc <b>"+dp(a)+" = "+fm(m)+"</b>."],
   ["c0","Je calcule deux points",tabV(m,q)+"Pour "+I("x")+" = 1 : "+I("y")+" = "+par(m)+" × 1 + "+par(q)+" = "+fm(m+q)],
   ["c1","Je trace la droite","Je place les points (0 ; "+fm(q)+") et (1 ; "+fm(m+q)+"), puis je trace la droite : c’est la tangente."]
  ];
  if(hz) L=[L[0],["c1","Je trace la droite","La tangente est <b>horizontale</b> : elle est parallèle à l’axe des abscisses. Inutile de calculer des points, je la trace directement à la hauteur "+I("y")+" = "+fm(q)+" : c’est la tangente."]];
  return L;
}
function drawTr(p){
  var k=cs(p.ci,p.ai,p.CU), n=p.n, a=k.a, m=k.m, q=k.p, g=base()+curve(k.c.f);
  var hz=(m===0), nl=hz?2:3;
  if(!hz&&n>=2) g+=cross(0,q,"cP")+cross(1,m+q,"cP");
  if(n>=nl) g+=ln(m,q,"tan");
  if(n>=nl) g+=cross(a,k.fa,"cA")+T("A",X(a)-10,Y(k.fa)-12,"tA","end");
  $("svg"+p.i).innerHTML=g;
  var rows=rowsTr(p);
  setBtn(p.i,n,rows.length);
  $("out"+p.i).innerHTML='<p class="txt">Courbe de '+k.c.lab+'.</p><div class="box red">La tangente à la courbe au point d’abscisse '+fm(a)+' a pour équation <b>'+eqS(m,q)+'</b>.<br>Que vaut '+dp(a)+' ? Puis tracer la tangente.</div>'+stepsHTML(rows,n);
}
function initTr(p){
  p.CU=mkCU(p.c.courbes); p.ci=0; p.ai=2;
  $("ctl"+p.i).innerHTML='<button type="button" class="act" id="btn'+p.i+'">Étape suivante →</button>';
  $("btn"+p.i).onclick=function(){ p.n=(p.n>=rowsTr(p).length)?0:p.n+1; render(); };
  selUI("sel"+p.i,p,true,p.CU);
}

/* ================= entraînement ================= */
function mdUI(p){
  var el=$("md"+p.i);
  el.innerHTML='<span class="sl">Exercice :</span><button type="button" class="b'+(p.mode==="lire"?" on":"")+'" data-m="lire">Lire sur le graphique</button><button type="button" class="b'+(p.mode==="tracer"?" on":"")+'" data-m="tracer">Tracer à partir de l’équation</button>';
  el.onclick=function(e){ var b=e.target.closest("button"); if(!b) return; p.mode=b.getAttribute("data-m"); p.rev=false; mdUI(p); render(); };
}
function drawEnt(p){
  var k=cs(p.ci,p.ai,p.CU), a=k.a, m=k.m, q=k.p, g=base()+curve(k.c.f), o="";
  if(p.mode==="lire"){
    g+=ln(m,q,"tan")+cross(a,k.fa,"cA")+T("A",X(a)-10,Y(k.fa)-12,"tA","end");
    o='<p class="txt">Courbe de '+k.c.lab+'.<br>La tangente est tracée au point A d’abscisse '+fm(a)+'.<br><b>Lis '+fp(a)+', '+dp(a)+' et l’équation de la tangente.</b></p>';
    if(p.rev) o+='<div class="box">'+fp(a)+' = '+fm(k.fa)+' : c’est l’<b>ordonnée du point A</b> (on la lit sur l’axe des ordonnées).<br>'+dp(a)+' = '+fm(m)+' : c’est le <b>coefficient directeur de la tangente</b> en A.<br><b>Attention : ne pas confondre '+I("f")+'('+I("a")+') et '+I("f")+'′('+I("a")+').</b><br>Équation de la tangente : '+eqS(m,q)+'</div>';
  } else {
    o='<p class="txt">Courbe de '+k.c.lab+'.</p><div class="box red">La tangente au point d’abscisse '+fm(a)+' a pour équation <b>'+eqS(m,q)+'</b>.<br>Que vaut '+dp(a)+' ? Puis tracer la tangente.</div>';
    if(p.rev){
      g+=(m===0?"":cross(0,q,"cP")+cross(1,m+q,"cP"))+ln(m,q,"tan")+cross(a,k.fa,"cA")+T("A",X(a)-10,Y(k.fa)-12,"tA","end");
      o+='<div class="box">L’équation est de la forme '+'<span class="nw">'+I("y")+' = '+I("a")+I("x")+' + '+I("b")+'</span>'+' : le coefficient directeur de la tangente est '+I("a")+' = '+fm(m)+'.<br>Or '+dp(a)+' est le coefficient directeur de la tangente en A, donc <b>'+dp(a)+' = '+fm(m)+'</b>.<br><br>'+(m===0?'Comme la droite est <b>horizontale</b>, parallèle à l’axe des abscisses, on la trace directement à la hauteur '+I("y")+' = '+fm(q)+'.':'Pour tracer la droite, je fais un tableau de valeurs :<br>'+tabV(m,q)+'Je place les points (0 ; '+fm(q)+') et (1 ; '+fm(m+q)+') puis je trace la droite.')+'</div>';
    }
  }
  $("svg"+p.i).innerHTML=g;
  $("rev"+p.i).textContent=p.rev?"Masquer la correction":"Afficher la correction";
  $("out"+p.i).innerHTML=o;
}
function initEnt(p){
  p.CU=mkCU(p.c.courbes); p.ci=0; p.ai=2; p.mode="lire"; p.rev=false;
  $("ctl"+p.i).innerHTML='<div class="sel" id="md'+p.i+'"></div><button type="button" class="act" id="new'+p.i+'">Nouvel exemple</button><button type="button" class="act alt" id="rev'+p.i+'">Afficher la correction</button>';
  mdUI(p);
  $("new"+p.i).onclick=function(){ autreExemple(p); render(); };
  $("rev"+p.i).onclick=function(){ p.rev=!p.rev; render(); };
  $("sel"+p.i).hidden=true;
}

/* ================= fenêtres : déplacer, redimensionner, texte proportionnel ================= */
function fitPage(sec){
  var wins=sec.querySelectorAll(".win"), bot=0, i;
  for(i=0;i<wins.length;i++) bot=Math.max(bot,wins[i].offsetTop+wins[i].offsetHeight);
  sec.style.minHeight=Math.max(innerHeight,bot+90)+"px";
}
function initWin(w){
  var bar=w.querySelector(".wbar"), d=null, base=parseFloat(w.getAttribute("data-fs"))||0;
  bar.addEventListener("pointerdown",function(e){
    var r=w.getBoundingClientRect(), pr=w.parentNode.getBoundingClientRect();
    d={dx:e.clientX-r.left,dy:e.clientY-r.top,px:pr.left,py:pr.top};
    try{ bar.setPointerCapture(e.pointerId); }catch(err){}
    w.style.zIndex=String(++initWin.z);
  });
  bar.addEventListener("pointermove",function(e){
    if(!d) return;
    w.style.left=clamp(e.clientX-d.dx-d.px,-w.offsetWidth+90,innerWidth-90)+"px";
    w.style.top=Math.max(0,e.clientY-d.dy-d.py)+"px";
  });
  function end(){ if(d){ d=null; fitPage(w.parentNode); } }
  bar.addEventListener("pointerup",end); bar.addEventListener("pointercancel",end);
  var grip=document.createElement("div"), rz=null; grip.className="grip"; grip.title="Redimensionner"; w.appendChild(grip);
  grip.addEventListener("pointerdown",function(e){
    rz={x:e.clientX,y:e.clientY,w:w.offsetWidth,h:w.offsetHeight};
    try{ grip.setPointerCapture(e.pointerId); }catch(err){}
    w.style.zIndex=String(++initWin.z); e.preventDefault();
  });
  grip.addEventListener("pointermove",function(e){
    if(!rz) return;
    w.style.width=clamp(rz.w+e.clientX-rz.x,200,innerWidth-8)+"px";
    w.style.height=Math.max(120,rz.h+e.clientY-rz.y)+"px";
  });
  function endRz(){ rz=null; }
  grip.addEventListener("pointerup",endRz); grip.addEventListener("pointercancel",endRz);
  if(window.ResizeObserver){
    new ResizeObserver(function(){
      if(base) w.style.setProperty("--fs",clamp(w.offsetWidth/base,6,200)+"px");
      if(!w.parentNode.hidden) fitPage(w.parentNode);
    }).observe(w);
  }
}
initWin.z=10;
function layoutPage(sec){
  var wins=sec.querySelectorAll(".win"), vw=innerWidth, vh=innerHeight, f, t, c, fw, tl, tw, fh;
  if(wins.length===1){
    var ww=Math.min(920,vw-32), w=wins[0];
    w.style.width=ww+"px"; w.style.left=Math.max(16,(vw-ww)/2)+"px"; w.style.top="30px"; w.style.height=Math.min(vh-130,640)+"px";
  } else {
    f=wins[0]; t=wins[1]; c=wins[2];
    if(vw>=860){
      fw=Math.min(Math.round(vw*0.45),620); fh=fw+30; tl=16+fw+16; tw=Math.min(vw-tl-16,780);
      f.style.left="16px"; f.style.top="14px"; f.style.width=fw+"px"; f.style.height=fh+"px";
      t.style.left=tl+"px"; t.style.top="14px"; t.style.width=tw+"px"; t.style.height=Math.max(fh,Math.min(vh-100,720))+"px";
      if(c){ var cw=Math.min(360,fw-24); c.style.width=cw+"px"; c.style.height="190px"; c.style.left="28px"; c.style.top=(14+fh-210)+"px"; }
    } else {
      fw=vw-32; fh=fw+30;
      f.style.left="16px"; f.style.top="14px"; f.style.width=fw+"px"; f.style.height=fh+"px";
      t.style.left="16px"; t.style.top=(14+fh+16)+"px"; t.style.width=fw+"px"; t.style.height="520px";
      if(c){ c.style.width=Math.min(340,fw-24)+"px"; c.style.height="190px"; c.style.left="24px"; c.style.top=(14+fh-210)+"px"; }
    }
  }
  sec.setAttribute("data-laid","1");
  fitPage(sec);
}
Array.prototype.forEach.call(document.querySelectorAll(".win"),initWin);

/* ================= initialisation des pages et navigation ================= */
var DRAW={taux:drawEx,curseur:drawCur,tangente:drawTg,lire:drawLire,equation:drawEq,tracer:drawTr,entrainement:drawEnt};
var INIT={taux:initEx,curseur:initCur,tangente:initTg,lire:initLire,equation:initEq,tracer:initTr,entrainement:initEnt};
P.forEach(function(p){
  if(INIT[p.type]) INIT[p.type](p);
  if(p.type==="carte"&&p.c.bouton){ $("go"+p.i).onclick=function(){ goPage(p.i+1); }; }
});
function render(){ var p=P[page-1]; if(DRAW[p.type]) DRAW[p.type](p); }
function goPage(n){
  page=clamp(n,1,NP);
  for(var i=1;i<=NP;i++) $("pg"+i).hidden=(i!==page);
  var sec=$("pg"+page);
  if(!sec.getAttribute("data-laid")) layoutPage(sec); else fitPage(sec);
  $("pNum").textContent=page+" / "+NP;
  $("pPrev").disabled=(page===1); $("pNext").disabled=(page===NP);
  render(); window.scrollTo(0,0);
}
$("pPrev").onclick=function(){ goPage(page-1); };
$("pNext").onclick=function(){ goPage(page+1); };
document.addEventListener("keydown",function(e){
  if(e.target&&/INPUT|TEXTAREA/.test(e.target.tagName)) return;
  if(e.key==="ArrowRight"||e.key==="PageDown") goPage(page+1);
  if(e.key==="ArrowLeft"||e.key==="PageUp") goPage(page-1);
});
goPage(1);
})();
</script>
</body>
</html>
